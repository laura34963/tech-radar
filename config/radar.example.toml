# NOTE: top-level `categories` MUST appear before the first [table] header,
# otherwise TOML nests it under the preceding table (e.g. [stack]).
categories = ["backend", "frontend", "devops", "cloud", "security", "ai"]

[general]
title = "Kdan Tech Radar"
timezone = "Asia/Taipei"
max_items_per_category = 15
lookback_days = 7
min_keep_importance = "medium"      # low | medium | high | critical
min_display_importance = "high"

# Source fairness. `max_card_items` budgets the card tier (high/critical items);
# under budget the pass is a no-op no matter how lopsided the sources are, so a
# quiet week is never trimmed. `per_source_limit` is a FLOOR, not a cap: each
# source is guaranteed up to that many cards, a source holding fewer keeps what
# it has, and the surplus budget goes to the best leftovers globally. Items that
# fit neither are demoted to "also noted", never discarded. Set max_card_items
# to 0 to disable. A high/critical severity is never demoted.
max_card_items   = 30
per_source_limit = 3

# Starting point only — tailor this to whatever you actually run. Terms match on
# word boundaries, so short entries are safe (e.g. "go" matches "Go" but not
# "google"/"logo").
[stack]
languages  = ["ruby", "go", "javascript", "python", "typescript", "golang"]
frameworks = ["rails", "react", "next.js", "react-dom"]
packages   = ["rails", "sidekiq", "puma", "devise", "nokogiri", "react",
              "axios", "nginx", "docker", "kubernetes", "k8s"]
ecosystems = ["rubygems", "npm", "pypi"]

# Per-category keyword boosting. An item in one of these categories whose
# title/summary/url mentions one of its terms is scored "high" (same tier as a
# [stack] hit) and floated as a card; scoped per-category so terms never leak
# across boards. Use for categories whose feeds don't touch [stack] terms — e.g.
# "ai": without this, every AI item scores "low" and is dropped at fetch.
# Terms match on word boundaries, so short words are safe: "ai" matches "AI"
# but not "email" or "available".
[category_keywords]
ai = ["llm", "gpt", "claude", "gemini", "openai", "anthropic", "mistral",
      "llama", "transformer", "diffusion", "agentic", "fine-tuning",
      "neural network", "machine learning", "deep learning", "hugging face"]

# Exclusion keywords: an item matching any applicable term is dropped at fetch
# and never written to the snapshot. `global` applies everywhere; a category key
# applies only within that category.
#
# Scoping is load-bearing. `preview` is pure noise on a frontend release feed
# but names a real product stage in a cloud announcement — globally it would kill
# "PostgreSQL 19 Beta 2 is now available in Amazon RDS Database Preview
# Environment". Same for the broad words in `ai` below: `community` and `program`
# would shred legitimate cloud and devops items if they were global.
#
# The `ai` list is the corporate-PR filter and is where this pays off most.
# Measured on the 2026-07-27 snapshot it takes openai.com from 10 card-tier items
# to 5, with every survivor substantive. Do NOT add "partner to address" — it
# killed "OpenAI and Hugging Face partner to address security incident", a real
# security story.
[exclude]
global   = ["fireside chat", "joins the board"]
frontend = ["canary", "preview", "nightly"]
devops   = ["beta", "alpha"]
ai       = ["small business", "joins the boards", "join the boards",
            "board of directors", "national science", "news organizations",
            "community", "program", "anniversary"]

# `board` routes an item to a digest tab: "tech" (技術資訊 — releases, official
# blogs, cloud changes, advisories) or "news" (新聞 — reporting, commentary,
# community discussion). Omitting it derives one by nature: social feeds → news,
# everything else → tech. Every source below sets it explicitly for clarity.
[[sources]]
type = "cloud"
category = "cloud"
board = "tech"
provider = "aws"
url = "https://aws.amazon.com/about-aws/whats-new/recent/feed/"
services = ["ec2", "s3", "lambda", "rds"]

[[sources]]
type = "cloud"
category = "cloud"
board = "tech"
provider = "azure"
url = "https://azure.microsoft.com/en-us/updates/feed/"

[[sources]]
type = "github"
category = "backend"
board = "tech"
repo = "rails/rails"

[[sources]]
type = "security"
category = "security"
board = "tech"              # OSV advisories — actionable, not news
feed = "osv"

[[sources]]
type = "security"           # GitHub Security Advisories; uses [stack].packages + ecosystems
category = "security"
board = "tech"              # advisories — actionable, not news
feed = "ghsa"               # optional GITHUB_TOKEN raises the rate limit

# Threat intel & security news (verified 2026-07-22; plain RSS, no auth).
# NOTE: some security sites (e.g. BleepingComputer) sit behind Cloudflare and
# return 403 to any non-browser client — a UA header alone won't fetch them.
[[sources]]
type = "rss"
category = "security"
board = "tech"              # CISA advisories are actionable reference, not news
url = "https://www.cisa.gov/cybersecurity-advisories/all.xml"   # CISA advisories

[[sources]]
type = "rss"
category = "security"
board = "news"
url = "https://feeds.feedburner.com/TheHackersNews"   # The Hacker News

[[sources]]
type = "rss"
category = "security"
board = "news"
url = "https://isc.sans.edu/rssfeed_full.xml"         # SANS Internet Storm Center

[[sources]]
type = "rss"
category = "security"
board = "news"
url = "https://krebsonsecurity.com/feed/"             # Krebs on Security

[[sources]]
type = "rss"
category = "security"
board = "news"
url = "https://unit42.paloaltonetworks.com/feed/"     # Palo Alto Unit 42

[[sources]]
type = "rss"
category = "security"
board = "news"
url = "https://blog.talosintelligence.com/rss/"       # Cisco Talos

[[sources]]
type = "rss"
category = "security"
board = "news"
url = "https://thedfirreport.com/feed/"               # The DFIR Report

[[sources]]
type = "rss"                # Reddit's .json API returns 403 to unauthenticated
category = "security"       # clients; the per-subreddit .rss feed still works.
board = "news"
url = "https://www.reddit.com/r/netsec/.rss"   # note: RSS carries no score, so min_points can't apply

[[sources]]
type = "social"
category = "frontend"
board = "news"              # HN community discussion
source = "hn"
query = "react OR frontend"
min_points = 100

[[sources]]
type = "social"
category = "frontend"
board = "news"              # Reddit community discussion
source = "reddit"
subreddit = "reactjs"
query = ""                  # optional; empty -> newest posts, set -> search within the subreddit
min_points = 50

[[sources]]
type = "registry"           # package-registry release news; complements github releases
category = "frontend"
board = "tech"              # release announcements
registry = "npm"            # npm | pypi | rubygems
packages = ["react", "axios"]

[[sources]]
type = "registry"
category = "backend"
board = "tech"              # release announcements
registry = "rubygems"
packages = ["rails", "sidekiq"]

# AI — frontier labs + open-source ecosystem (RSS scored via [category_keywords]),
# plus HN for community pulse and labs without a public feed (e.g. Anthropic).
# RSS feeds verified 2026-07-23. Note: HN is event-driven — a story only surfaces
# once it clears min_points AND falls inside lookback_days, so it stays quiet
# between notable AI launches.
[[sources]]
type = "rss"
category = "ai"
board = "tech"              # official lab blog
url = "https://openai.com/blog/rss.xml"             # OpenAI

[[sources]]
type = "rss"
category = "ai"
board = "tech"              # official lab blog
url = "https://deepmind.google/blog/rss.xml"        # Google DeepMind

[[sources]]
type = "rss"
category = "ai"
board = "tech"              # official project blog
url = "https://huggingface.co/blog/feed.xml"        # Hugging Face

[[sources]]
type = "rss"
category = "ai"
board = "news"              # independent commentary/analysis, not an official blog
url = "https://simonwillison.net/atom/everything/"  # Simon Willison (keyword-filtered to AI)

[[sources]]
type = "social"
category = "ai"
board = "news"              # HN community discussion
source = "hn"
query = "LLM OR GPT OR Claude OR OpenAI OR Anthropic"
min_points = 100

[llm]
enabled = true
provider = "gemini"
base_url = "https://generativelanguage.googleapis.com"
model = "gemini-flash-latest"
api_key_env = "RADAR_LLM_API_KEY"
max_items_to_enrich = 40
# Enrichment batching: cap items per LLM call so large categories can't hit the
# provider timeout, and run chunks concurrently.
enrich_chunk_size  = 8   # max items packed into one LLM call
enrich_concurrency = 4   # max concurrent LLM calls
# Gemini example:
#   provider = "gemini"
#   base_url = "https://generativelanguage.googleapis.com"   # optional; this is the default
#   model = "gemini-2.5-flash"
#   api_key_env = "RADAR_LLM_API_KEY"
# OpenAI example:
#   provider = "openai_compatible"
#   base_url = "https://api.openai.com/v1"   # optional; this is the default
#   model = "gpt-4o-mini"
#   api_key_env = "RADAR_LLM_API_KEY"
# CLI example (route through a locally-authenticated LLM CLI; no API key needed).
# The prompt is piped on stdin; use a {prompt} token if the CLI takes it as an arg.
#   provider = "cli"
#   command = "claude -p"                    # or: "gemini -m gemini-2.5-flash"
#   command_timeout = 120                    # seconds (optional)
